<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRM-16 Rhythm Composer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#a9a28b;--case:#d6ceb5;--panel:#c4bca1;--ink:#2b261d;--mut:#756d55;--b1:#f1ebd8;--b2:#bcb497;--g1:#f0d49a;--g2:#c99f48;--sh:#00000038;--on:#e4501b;--onl:#ff9660;--lcd:#27341a;--lcdt:#b9ff5c;--cur:#2fd400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130e;--case:#27241c;--panel:#332f24;--ink:#e8e1ca;--mut:#9b937a;--b1:#4d4838;--b2:#2c2920;--g1:#7d6631;--g2:#58451f;--sh:#000a}}
:root[data-theme="dark"]{--bg:#15130e;--case:#27241c;--panel:#332f24;--ink:#e8e1ca;--mut:#9b937a;--b1:#4d4838;--b2:#2c2920;--g1:#7d6631;--g2:#58451f;--sh:#000a}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.3 "Courier New",ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center;padding:12px}
.unit{width:100%;max-width:1000px;background:var(--case);border-radius:10px;padding:14px;box-shadow:0 8px 0 var(--sh),inset 0 2px 0 #ffffff40}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{margin:0;font:900 24px/1 "Arial Black",Impact,sans-serif;letter-spacing:.12em}
h1 small{display:block;font:700 10px/1.4 "Courier New",monospace;letter-spacing:.3em;color:var(--mut);margin-top:4px}
.stripe{height:6px;margin-bottom:10px;background:linear-gradient(90deg,#e4501b 0 25%,#e0a526 0 50%,#3f9c8c 0 75%,#3e6fb4 0)}
.lcd{background:var(--lcd);color:var(--lcdt);font-size:24px;padding:3px 10px;border-radius:4px;box-shadow:inset 0 2px 6px #000b;text-align:right;min-width:3ch;text-shadow:0 0 6px var(--lcdt)}
.btn{font:700 13px "Courier New",monospace;letter-spacing:.06em;color:var(--ink);padding:10px 14px;border:0;border-radius:5px;background:linear-gradient(var(--b1),var(--b2));box-shadow:0 4px 0 var(--mut),0 6px 6px var(--sh);cursor:pointer;transition:transform .05s,box-shadow .05s}
.btn:active,.btn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--mut)}
.btn.on{background:linear-gradient(var(--onl),var(--on));color:#fff}
.btn:focus-visible,.st:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.master{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--panel);padding:10px;border-radius:6px;box-shadow:inset 0 2px 4px var(--sh);margin-bottom:10px}
.master .grp{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;padding-left:14px;border-left:2px solid var(--mut)}
label.k{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--mut);letter-spacing:.05em}
label.k input{width:96px;margin:0;accent-color:var(--on)}
.trk{background:var(--panel);border-radius:6px;padding:8px 10px;margin-bottom:8px;box-shadow:inset 0 2px 4px var(--sh)}
.th{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:flex-end;margin-bottom:8px}
.th h2{margin:0;font:900 14px "Arial Black",Impact,sans-serif;letter-spacing:.1em;min-width:9ch;align-self:center}
.len{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--mut);font-size:10px}
.len .btn{padding:2px 10px;box-shadow:0 2px 0 var(--mut);font-size:15px}.len .lcd{font-size:16px;min-width:2ch}
.wrap{overflow-x:auto;padding-bottom:4px}.in{min-width:520px}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.st{height:36px;border:0;border-radius:4px;padding:0;position:relative;cursor:pointer;background:linear-gradient(var(--b1),var(--b2));box-shadow:0 3px 0 var(--mut),0 5px 4px var(--sh)}
.st:nth-child(4n+1){background:linear-gradient(var(--g1),var(--g2))}
.st.on{background:linear-gradient(var(--onl),var(--on));box-shadow:0 1px 0 var(--mut),0 0 10px var(--on);transform:translateY(2px)}
.st::after{content:"";position:absolute;top:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0004}
.st.cur::after{background:var(--cur);box-shadow:0 0 7px 2px var(--cur)}
.st.x,.pb.x{opacity:.22;pointer-events:none}
.probs{margin-top:6px}
.pb{height:28px;background:var(--lcd);border-radius:3px;position:relative;overflow:hidden;touch-action:none;cursor:ns-resize}
.pb i{position:absolute;left:0;right:0;bottom:0;background:var(--lcdt);opacity:.85}
.hint{color:var(--mut);font-size:11px;margin:8px 2px 0}
</style></head><body>
<div class="unit">
<header><h1>DRM-16<small>RHYTHM COMPOSER / POLYMETER</small></h1><div class="lcd" id="bpmL">120</div></header>
<div class="stripe"></div>
<div class="master" id="mst"></div>
<div id="trks"></div>
<p class="hint">Клик по кнопке — включить шаг. Тяните вверх/вниз по зелёному столбику под шагом — вероятность срабатывания. Кнопки − / + задают длину дорожки (3–16): разные длины дают полиритмы.</p>
</div>
<script>
const $=s=>document.querySelector(s),R=Math.random,el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const P={bpm:122,swing:54,drive:40,tone:65,mix:100,level:80};
const T=[
{id:'kick',n:'KICK',sp:[['pitch','Pitch',35,90,50],['decay','Decay',.1,1,.45],['drive','Sat',0,100,40]]},
{id:'snare',n:'SNARE',sp:[['tone','Tone',120,320,190],['noise','Noise',.05,.6,.2]]},
{id:'hat',n:'HI-HAT',sp:[['decay','Decay',.02,.6,.07],['tone','Tone',3000,10000,7000]]},
{id:'fm',n:'FM PERC',sp:[['pitch','Pitch',60,900,220],['ratio','Ratio',.5,8,2.5],['index','Index',0,12,4],['decay','Decay',.05,.9,.25]]}];
T.forEach(t=>{t.len=16;t.v={};t.sp.forEach(a=>t.v[a[0]]=a[4]);t.s=Array.from({length:16},()=>({on:false,pr:100}))});

/* ---------- audio ---------- */
let ctx,bus,sat,tone,wet,dry,out,kSh,noise;
const curve=f=>{const c=new Float32Array(2048);for(let i=0;i<2048;i++)c[i]=f(i/1024-1);return c};
function kcurve(){if(!ctx)return;const k=1+T[0].v.drive/8;kSh.curve=curve(x=>Math.tanh(x*k)/Math.tanh(k)*.9)}
function master(){if(!ctx)return;const k=1+P.drive/12,b=.12;
 sat.curve=curve(x=>(Math.tanh(k*x+b)-Math.tanh(b))/Math.tanh(k)*.95);
 tone.frequency.value=1500*Math.pow(12,P.tone/100);wet.gain.value=P.mix/100;dry.gain.value=1-P.mix/100;out.gain.value=P.level/100}
function init(){ctx=new AudioContext();bus=ctx.createGain();sat=ctx.createWaveShaper();sat.oversample='4x';
 tone=ctx.createBiquadFilter();tone.type='lowpass';wet=ctx.createGain();dry=ctx.createGain();out=ctx.createGain();
 const lim=ctx.createDynamicsCompressor();lim.threshold.value=-8;lim.ratio.value=12;lim.attack.value=.003;
 bus.connect(sat);sat.connect(tone);tone.connect(wet);wet.connect(out);bus.connect(dry);dry.connect(out);out.connect(lim);lim.connect(ctx.destination);
 kSh=ctx.createWaveShaper();kSh.oversample='2x';kSh.connect(bus);
 noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
 master();kcurve()}
const env=(g,t,a,d,pk)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
const V={
kick(t,p){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(p.pitch*4.5,t);o.frequency.exponentialRampToValueAtTime(p.pitch,t+.07);
 env(g,t,.002,p.decay,1.3);o.connect(g);g.connect(kSh);o.start(t);o.stop(t+p.decay+.05)},
snare(t,p){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(p.tone*1.5,t);o.frequency.exponentialRampToValueAtTime(p.tone,t+.04);
 env(g,t,.001,.13,.55);o.connect(g);g.connect(bus);o.start(t);o.stop(t+.2);
 const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),ng=ctx.createGain();n.buffer=noise;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;
 env(ng,t,.001,p.noise,.7);n.connect(f);f.connect(ng);ng.connect(bus);n.start(t,R()*.5);n.stop(t+p.noise+.05)},
hat(t,p){const hp=ctx.createBiquadFilter(),g=ctx.createGain();hp.type='highpass';hp.frequency.value=p.tone;
 [2,3,4.16,5.43,6.79,8.21].forEach(m=>{const o=ctx.createOscillator();o.type='square';o.frequency.value=m*40;o.connect(hp);o.start(t);o.stop(t+p.decay+.05)});
 env(g,t,.001,p.decay,.2);hp.connect(g);g.connect(bus)},
fm(t,p){const c=ctx.createOscillator(),m=ctx.createOscillator(),mg=ctx.createGain(),g=ctx.createGain();
 c.frequency.setValueAtTime(p.pitch*1.6,t);c.frequency.exponentialRampToValueAtTime(p.pitch,t+.05);m.frequency.value=p.pitch*p.ratio;
 mg.gain.setValueAtTime(p.index*p.pitch+1,t);mg.gain.exponentialRampToValueAtTime(1,t+p.decay);
 env(g,t,.001,p.decay,.6);m.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(bus);
 c.start(t);m.start(t);c.stop(t+p.decay+.05);m.stop(t+p.decay+.05)}};

/* ---------- scheduler (global 16th ticks, per-track step = tick % len) ---------- */
let timer,playing=false,tick=0,next=0,q=[],last=[];
function sched(){const sd=60/P.bpm/4;
 while(next<ctx.currentTime+.12){const t=next+(tick%2?(2*P.swing/100-1)*sd:0);
  T.forEach((tr,i)=>{const si=tick%tr.len,s=tr.s[si];if(s.on&&R()*100<s.pr)V[tr.id](t,tr.v);q.push({t,i,si})});
  next+=sd;tick++}
 if(q.length>256)q.splice(0,128)}
(function loop(){if(ctx&&playing)while(q.length&&q[0].t<=ctx.currentTime){const e=q.shift();
 if(last[e.i]!=null)cells[e.i][last[e.i]].classList.remove('cur');cells[e.i][e.si].classList.add('cur');last[e.i]=e.si}
 requestAnimationFrame(loop)})();

/* ---------- UI ---------- */
const syncs=[],cells=[],bars=[],lens=[];
function sl(par,o,k,lab,min,max,cb){const l=el('label','k'),t=el('span'),i=el('input');i.type='range';i.min=min;i.max=max;i.step=max-min>=20?1:'any';l.append(t,i);
 const f=()=>{i.value=o[k];t.textContent=lab+' '+(+o[k]).toFixed(max-min>=20?0:2)};f();syncs.push(f);
 i.oninput=()=>{o[k]=+i.value;f();cb&&cb()};par.append(l)}
function refresh(i){const t=T[i];lens[i].textContent=t.len;
 for(let j=0;j<16;j++){const c=cells[i][j],b=bars[i][j],s=t.s[j];c.classList.toggle('on',s.on);c.classList.toggle('x',j>=t.len);
  b.classList.toggle('x',j>=t.len);b.firstChild.style.height=s.pr+'%';b.title=s.pr+'%'}}
const refreshAll=()=>T.forEach((_,i)=>refresh(i));

const m=$('#mst'),play=el('button','btn');play.textContent='▶ PLAY';m.append(play);
let g1=el('div','grp');m.append(g1);
sl(g1,P,'bpm','BPM',60,200,()=>$('#bpmL').textContent=Math.round(P.bpm));sl(g1,P,'swing','Swing %',50,75);
let g2=el('div','grp');m.append(g2);
sl(g2,P,'drive','Tape Drive',0,100,master);sl(g2,P,'tone','Tape Tone',0,100,master);sl(g2,P,'mix','Tape Mix',0,100,master);sl(g2,P,'level','Level',0,100,master);
const rb=el('button','btn');rb.textContent='RANDOMIZE GROOVE';const cb=el('button','btn');cb.textContent='CLEAR';
m.append(rb,cb);

T.forEach((t,i)=>{const s=el('section','trk'),th=el('div','th');th.innerHTML='<h2>'+t.n+'</h2>';
 t.sp.forEach(a=>sl(th,t.v,a[0],a[1],a[2],a[3],t.id=='kick'?kcurve:null));
 const ln=el('div','len');ln.innerHTML='<span>STEPS</span><button class="btn" aria-label="Короче">−</button><div class="lcd"></div><button class="btn" aria-label="Длиннее">+</button>';
 const [bm,bp]=ln.querySelectorAll('button');lens[i]=ln.querySelector('.lcd');
 const setLen=n=>{t.len=Math.max(3,Math.min(16,n));refresh(i)};bm.onclick=()=>setLen(t.len-1);bp.onclick=()=>setLen(t.len+1);th.append(ln);
 const w=el('div','wrap'),inn=el('div','in'),g=el('div','grid'),pr=el('div','grid probs');cells[i]=[];bars[i]=[];
 for(let j=0;j<16;j++){const b=el('button','st');b.setAttribute('aria-label',t.n+' шаг '+(j+1));b.onclick=()=>{t.s[j].on=!t.s[j].on;refresh(i)};g.append(b);cells[i].push(b);
  const p=el('div','pb');p.innerHTML='<i></i>';
  const set=e=>{const r=p.getBoundingClientRect();t.s[j].pr=Math.max(5,Math.min(100,Math.round((1-(e.clientY-r.top)/r.height)*20)*5));refresh(i)};
  p.onpointerdown=e=>{p.setPointerCapture(e.pointerId);set(e)};p.onpointermove=e=>{if(e.buttons)set(e)};pr.append(p);bars[i].push(p)}
 inn.append(g,pr);w.append(inn);s.append(th,w);$('#trks').append(s)});

play.onclick=async()=>{if(!ctx)init();await ctx.resume();playing=!playing;
 if(playing){tick=0;q=[];last=[];next=ctx.currentTime+.06;timer=setInterval(sched,25);sched()}
 else{clearInterval(timer);cells.forEach(c=>c.forEach(b=>b.classList.remove('cur')));last=[]}
 play.classList.toggle('on',playing);play.textContent=playing?'■ STOP':'▶ PLAY'};
cb.onclick=()=>{T.forEach(t=>t.s.forEach(s=>{s.on=false;s.pr=100}));refreshAll()};

/* ---------- Randomize Groove: electro / IDM, rule-based ---------- */
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[ri(0,a.length-1)],rp=(t,k,a,b)=>t.v[k]=a+R()*(b-a);
const euc=(k,n,r)=>{const a=Array.from({length:n},(_,i)=>(i*k)%n<k);return a.map((_,i)=>a[(i+r)%n])};
const setT=(t,len,fn)=>{t.len=len;t.s=Array.from({length:16},(_,i)=>{const r=i<len?fn(i):0;return{on:r>0,pr:r||100}})};
function randomize(){const[k,s,h,f]=T;
 let n=pick([16,16,16,15,12]);setT(k,n,i=>i==0?100:(i==n/2&&R()<.4)?100:([3,6,7,10,11,14].includes(i)&&R()<.35)?pick([100,80,60]):0);
 n=pick([16,16,16,12,14]);const b=4+Math.round(n/2);setT(s,n,i=>(i==4||i==b)?100:([7,9,15].includes(i)&&R()<.3)?pick([35,50,65]):0);
 n=pick([16,16,12,11,15]);let e=euc(ri(5,Math.min(11,n-1)),n,ri(0,n-1));setT(h,n,i=>e[i]?pick([100,100,70,45]):0);
 n=pick([5,6,7,9,10,13]);e=euc(ri(2,Math.ceil(n/2)),n,ri(0,n-1));setT(f,n,i=>e[i]?pick([100,85,60,40]):0);
 rp(k,'pitch',38,62);rp(k,'decay',.25,.7);rp(k,'drive',30,80);rp(s,'tone',150,260);rp(s,'noise',.12,.35);
 rp(h,'decay',.03,.2);rp(h,'tone',5000,9500);rp(f,'pitch',120,500);f.v.ratio=pick([1.41,2,2.5,3.5,4.07,5.19,1.5]);rp(f,'index',2,9);rp(f,'decay',.1,.4);
 P.bpm=ri(104,140);P.swing=ri(50,60);P.drive=ri(30,60);
 syncs.forEach(x=>x());$('#bpmL').textContent=Math.round(P.bpm);refreshAll();master();kcurve()}
rb.onclick=randomize;randomize();
</script></body></html>
